name: Build RF-D

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf-d-package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/package.yml

  release:
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/package.yml
