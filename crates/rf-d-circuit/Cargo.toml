[package]
name = "rf-d-circuit"
version = "0.1.0"
edition = "2021"
description = "Conditional circuit models for RF-D"
publish = false

[features]
# Offline timing diagnostics only; no timing calls in the audio step.
solver-profiling = []
# Reference factorization in documentary node order, for numerical/cost gates.
solver-natural-order = []
# Reference expm1 + exp evaluation of every semiconductor junction.
solver-dual-exp = []
# Historical transient KCL-only stop; diagnostic reference, not admission.
solver-kcl-only-transient = []
# Strict voltage-policy reference that recomputes accepted directions.
solver-uncached-direction = []

[dev-dependencies]
serde_json = "1"
