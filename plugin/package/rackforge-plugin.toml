schema_version = 1
id = "org.rackforge.lab.rf-d-pilot"
name = "RF-D Pilot"
vendor = "RackForge"
version = "0.3.0"
kind = "instrument"
state_version = 1
capabilities = ["audio_output", "midi_input", "presets", "state", "sample_accurate_automation"]

[midi]
channel_model = "single_part"
program_change = "ignore"

[[midi.input_buses]]
id = "main"
name = "Main"

[audio]
output_buses = [{ id = "main", name = "Output", channels = 2, layout = "stereo" }]

[api]
major = 1
minor = 11

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
